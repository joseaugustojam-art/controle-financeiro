<style>

form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}form .w{grid-column:1/3}form input,form select,form button.a{display:block;width:100%;min-width:0;max-width:100%;height:46px;box-sizing:border-box;margin:0;font-size:16px}.q{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--m)}

.i small{color:var(--m);display:block}.i button{border:0;background:none;color:var(--m);font-size:18px}
.g{color:var(--g)}.r{color:var(--r)}canvas{max-height:230px}.k div[onclick]{cursor:pointer}#v{touch-action:pan-y}@keyframes sl{from{transform:translateX(var(--dx,40px));opacity:.3}to{transform:none;opacity:1}}.sl{animation:sl .22s ease-out}[hidden]{display:none!important}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--p);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}.chip{display:inline-block;background:var(--bg);border:1px solid var(--b);border-radius:16px;padding:4px 4px 4px 10px;margin:3px}.chip button{border:0;background:none;color:var(--m)}.lk{border:0;background:none;color:var(--p);padding:6px 0;font-size:15px}.cs{font-size:13px;padding:2px 4px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--m);max-width:140px}
.row{display:flex;align-items:center;gap:10px}#mny{position:relative;border:0;background:none;padding:0;margin-left:auto;cursor:pointer;width:84px;height:56px}#mny svg{width:100%;height:100%;overflow:visible}
.w{display:none}#mny.hi .w{display:block}.wl{transform-origin:30px 38px;animation:fl .32s ease-in-out infinite alternate}
.b{animation:bob 2.4s ease-in-out infinite}#mny.hi .b{animation:bob2 .6s ease-in-out infinite}
@keyframes fl{from{transform:rotate(25deg)}to{transform:rotate(-30deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}.pp{background:var(--c);border-radius:16px 16px 0 0;padding:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;box-sizing:border-box;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.pp h3{margin:12px 0 4px;font-size:16px}
.dt{position:relative;display:flex;align-items:center;height:46px;box-sizing:border-box;padding:0 12px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font-size:16px;width:100%;min-width:0}.dt::after{content:"📅";margin-left:auto;font-size:15px}.dt input{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:0;border:0;padding:0;margin:0;font-size:16px}

.gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}.gc{max-width:420px;width:100%}.gate button.a{width:100%;height:46px}

</style></head><body><div id="gate" class="gate"><div class="gc"><div style="font-size:44px">🔒</div><h2 style="margin:8px 0">Controle Financeiro</h2>
<div style="display:flex;gap:6px;justify-content:center;margin:6px 0 12px"><button class="lk" id="tl" onclick="gtab(0)"><b>Entrar</b></button><button class="lk" id="tr" onclick="gtab(1)">Primeiro acesso</button></div>
<form id="gf" onsubmit="gsend(event)" style="display:grid;gap:10px;text-align:left"><input id="ge" type="email" placeholder="E-mail da compra" autocomplete="username" required><input id="gc" placeholder="Código da compra (HP...) — se não tiver, deixe em branco" hidden><input id="gp" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="current-password" required minlength="8"><button class="a" id="gb">Entrar</button><div id="gmsg" style="font-size:14px;color:var(--r);min-height:18px"></div></form>
<div style="margin-top:10px;font-size:12px;color:var(--m)">O acesso é liberado automaticamente após a confirmação da compra. Sem o código da compra, o seu pedido de acesso é enviado para aprovação.</div></div></div>
<main>
<div class="row"><h1>💰 Controle Financeiro</h1><button class="lk" style="margin-left:auto" onclick="sair()">Sair</button></div>
<div id="warn" class="card r" hidden>Sem conexão com o servidor: os dados valem só nesta sessão.</div>
<div class="row"><span class="dt" style="width:auto;flex:0 1 150px"><span id="mesTxt"></span><input id="mes" type="month" onchange="mes=this.value;draw()" onclick="try{this.showPicker()}catch(e){}" aria-label="Mês"></span><button id="mny" onclick="pop(1)" aria-label="Alertas e previsão de parcelas"><svg viewBox="0 0 96 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<g class="w"><g class="wl"><path d="M30 38C18 22 6 24 2 14C16 8 28 18 36 32Z" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/><path d="M31 37C21 30 13 30 7 26" fill="none" stroke="#a5d6a7" stroke-width="1.5"/></g></g>
<g class="w" transform="translate(96 0) scale(-1 1)"><g class="wl"><path d="M30 38C18 22 6 24 2 14C16 8 28 18 36 32Z" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/><path d="M31 37C21 30 13 30 7 26" fill="none" stroke="#a5d6a7" stroke-width="1.5"/></g></g>
<g class="b"><rect x="26" y="20" width="44" height="28" rx="3" fill="#2e7d32" transform="rotate(-8 48 34)"/><rect x="26" y="20" width="44" height="28" rx="3" fill="#43a047" transform="rotate(5 48 34)"/>
<rect x="26" y="18" width="44" height="28" rx="3" fill="#66bb6a" stroke="#1b5e20" stroke-width="1.5"/><circle cx="42" cy="32" r="8" fill="none" stroke="#1b5e20" stroke-width="1.5"/>
<text x="42" y="37" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20" font-family="Arial">$</text><rect x="56" y="16" width="9" height="32" fill="#fdd835" stroke="#f9a825"/></g></svg></button></div>
<nav id="nav"></nav><div id="hint" hidden style="text-align:center;color:var(--m);font-size:12px;margin-bottom:4px">‹ deslize para os lados para trocar de aba ›</div><div id="v"></div></main><div id="pop" class="ov" hidden onclick="pop(0)"><div id="pp" class="pp" onclick="event.stopPropagation()"></div></div><div id="ok" class="toast" hidden></div>
<script src="shim.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const $=s=>document.querySelector(s),T={res:'Resumo',ent:'Entradas',fix:'Fixos',var:'Variáveis',car:'Cartão'};
const C={ent:['Salário','Freelance','Investimentos','Outros'],fix:['Aluguel','Energia','Água','Internet','Condomínio','Outros'],var:['Mercado','Lazer','Transporte','Saúde','Restaurantes','Outros'],car:['Comida','Transporte','Mercado','Lazer','Saúde','Assinaturas','Compras','Outros']};
let rows=[],tab='res',mes=new Date().toISOString().slice(0,7),col=null,prev=null,note='',ch=[],cfg=null,fil='',ed=false,cl=[],pw='',db_=null,lm={},isOwner=false,reqs=[],myId='';
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=(x,t)=>t>0?(x/t*100).toFixed(1).replace('.',',')+'%':'—';
const fmt=m=>m.split('-').reverse().join('/'),xp={al:0,fim:0},dif=m=>{const[y1,m1]=mes.split('-').map(Number),[y2,m2]=m.split('-').map(Number);return(y2-y1)*12+m2-m1};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pm=d=>{let[y,m]=d.slice(0,7).split('-').map(Number);m--;if(!m){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
const mo=r=>r.tipo==='car'?r.fatura:r.tipo==='ent'?(r.quita||pm(r.data)):r.data.slice(0,7);
const fv=v=>v?v.split('-').reverse().join('/'):'Selecionar';
const dtb=(n,t,v,x)=>`<span class="dt"><span>${fv(v)}</span><input name="${n}" type="${t}" value="${v}" required onchange="dv(this);${x||''}" onclick="try{this.showPicker()}catch(e){}" aria-label="${n}"></span>`;
function dv(el){el.previousElementSibling.textContent=fv(el.value)}
function qd(el){const q=el.form.quita;if(q&&el.value){q.value=pm(el.value);dv(q)}}
const sum=(t,m)=>rows.filter(r=>r.tipo===t&&mo(r)===m).reduce((s,r)=>s+r.valor,0);
const key=r=>[r.data,r.desc.toUpperCase().trim(),r.valor.toFixed(2),r.parcAt].join('|');
const am=(m,n)=>{let[y,x]=m.split('-').map(Number);x+=n;y+=Math.floor((x-1)/12);x=(x-1)%12+1;return y+'-'+String(x).padStart(2,'0')};
const nm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,14),sk=r=>nm(r.desc)+'|'+r.valor.toFixed(2)+'|'+r.parc,pk=r=>r.parc>1?sk(r)+'|'+r.parcAt:key(r);
function upd(id,o){if(col)return col.doc(id).update(o);Object.assign(rows.find(x=>x.id==id),o);draw();return Promise.resolve()}
function lancarCar(list){
 const ex=new Map(rows.filter(r=>r.tipo=='car').map(r=>[pk(r),r])),ps=[];let n=0,c=0,d=0,p=0;
 list.forEach(r=>{const k=pk(r),h=ex.get(k);
  if(h){if(h.proj){ps.push(upd(h.id,{proj:false,valor:r.valor,data:r.data,fatura:r.fatura}));h.proj=false;c++}else d++;return}
  ps.push(put(r));ex.set(k,r);n++;
  for(let i=1;i<=r.parc-r.parcAt;i++){const q={...r,parcAt:r.parcAt+i,fatura:am(r.fatura,i),proj:true},kq=pk(q);if(!ex.has(kq)){ex.set(kq,q);ps.push(put(q));p++}}});
 return{ps,n,c,d,p}}
function draw(){
 $('#mes').value=mes;$('#mesTxt').textContent=fv(mes);
 $('#nav').innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';fil='';ed=false;draw()">${T[k]}</button>`).join('');
 {const n=$('#nav'),o=n.querySelector&&n.querySelector('.on');if(o)n.scrollLeft=o.offsetLeft-(n.clientWidth-o.offsetWidth)/2}
 ch.forEach(c=>c.destroy());ch=[];
 $('#v').innerHTML=tab=='res'?resumo():tab=='parc'?parcelas():tab=='ext'?extrato():lista();
 if(tab=='res')graficos();
 {const m=$('#mny');if(m)m.className=info().alto?'hi':''}
}
function resumo(){
 const a=sum('ent',mes),f=sum('fix',mes),v=sum('var',mes),c=sum('car',mes),s=a-f-v-c,P=rows.filter(r=>r.tipo=='car'&&mo(r)===mes&&r.parc>1),pv=P.reduce((x,r)=>x+r.valor,0),pf=P.reduce((x,r)=>x+r.valor*(r.parc-r.parcAt),0),pa=P.length?P.reduce((x,r)=>x+(r.parc-r.parcAt),0)/P.length:0,
  se=new Map(),cg={};
 rows.filter(r=>r.tipo=='car'&&r.parc>1).forEach(r=>se.set(sk(r),{d:r.desc,e:am(r.fatura,r.parc-r.parcAt)}));
 rows.filter(r=>r.tipo!='ent'&&mo(r)===mes).forEach(r=>cg[r.cat]=(cg[r.cat]||0)+r.valor);
 const ac=[...se.values()].filter(x=>x.e>=mes).sort((x,y)=>x.e.localeCompare(y.e)),fim=ac[ac.length-1],prox=ac[0],tg0=f+v+c,
  top=Object.entries(cg).sort((x,y)=>y[1]-x[1])[0],tt=[['fix','Gastos fixos',f],['var','Gastos variáveis',v],['car','Cartão',c]].sort((x,y)=>y[2]-x[2])[0],
  warn=tg0>0&&(top[1]/tg0>=.4||tg0>a);
 return `<div class="k"><div onclick="go('ent')"><small>Receita que quita o mês ›</small><b>${brl(a)}</b></div><div onclick="go('fix')"><small>Fixas ›</small><b>${brl(f)}</b></div><div onclick="go('var')"><small>Variáveis ›</small><b>${brl(v)}</b></div><div onclick="go('car')"><small>Cartão ›</small><b>${brl(c)}</b></div>
 <div onclick="go('ext')"><small>Saldo líquido ›</small><b class="${s<0?'r':'g'}">${brl(s)}</b></div><div onclick="go('ext')"><small>% salvo ›</small><b class="${s<0?'r':'g'}">${a?(s/a*100).toFixed(1):0}%</b></div></div>
 <div class="k" style="margin-top:8px;cursor:pointer" onclick="tab='parc';draw()"><div><small>Compras parceladas (cartão) ›</small><b>${P.length}</b></div><div><small>Parcelas no mês</small><b>${brl(pv)}</b></div><div><small>Falta pagar (estimado)</small><b>${brl(pf)}</b></div><div><small>Média de parcelas restantes</small><b>${pa.toFixed(1).replace('.',',')}</b></div><div><small>% da receita em parcelas</small><b>${pct(pv,a)}</b></div><div><small>% das despesas em parcelas</small><b>${pct(pv,f+v+c)}</b></div></div>
 <div style="color:var(--m);font-size:13px;margin:4px 2px">Toque nos cards de parcelamento para ver todas as compras parceladas ›</div>
 <div class="card"><canvas id="c1"></canvas></div><div class="card"><canvas id="c4"></canvas></div><div class="card"><canvas id="c2"></canvas></div><div class="card"><canvas id="c3"></canvas></div>`;
}
function graficos(){
 if(!window.Chart)return;
 const a=sum('ent',mes),f=sum('fix',mes),v=sum('var',mes),c=sum('car',mes),y=mes.slice(0,4);
 const pv=rows.filter(r=>r.tipo=='car'&&mo(r)===mes&&r.parc>1).reduce((x,r)=>x+r.valor,0),tg=f+v+c,lb=(n,x)=>n+' '+pct(x,tg);
 ch.push(new Chart($('#c1'),{type:'doughnut',data:{labels:[lb('Fixos',f),lb('Variáveis',v),lb('Cartão à vista',c-pv),lb('Cartão parcelado',pv)],datasets:[{data:[f,v,c-pv,pv],backgroundColor:['#4e79a7','#f28e2b','#e15759','#b07aa1']}]},options:{plugins:{title:{display:true,text:'Gastos do mês (% do total)'}}}}));
 const cg={};rows.filter(r=>r.tipo!='ent'&&mo(r)===mes).forEach(r=>cg[r.cat]=(cg[r.cat]||0)+r.valor);
 const ce=Object.entries(cg).filter(e=>e[1]>0).sort((x,y)=>y[1]-x[1]),pal=['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#bab0ac'];
 ch.push(new Chart($('#c4'),{type:'pie',data:{labels:ce.map(e=>e[0]+' '+pct(e[1],tg)),datasets:[{data:ce.map(e=>e[1]),backgroundColor:ce.map((e,i)=>pal[i%10])}]},options:{plugins:{title:{display:true,text:'Gastos por tipo (fixos + variáveis + cartão)'}}}}));
 ch.push(new Chart($('#c2'),{type:'bar',data:{labels:['Receitas','Despesas','Parcelas'],datasets:[{data:[a,f+v+c,pv],backgroundColor:['#59a14f','#e15759','#b07aa1']}]},options:{plugins:{legend:{display:false},title:{display:true,text:'Receitas vs Despesas · parcelas = '+pct(pv,a)+' da receita'}}}}));
 const ms=[...Array(12)].map((_,i)=>y+'-'+String(i+1).padStart(2,'0'));
 ch.push(new Chart($('#c3'),{type:'line',data:{labels:['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],datasets:[{data:ms.map(m=>sum('ent',m)-sum('fix',m)-sum('var',m)-sum('car',m)),borderColor:'#4e79a7',tension:.3}]},options:{plugins:{legend:{display:false},title:{display:true,text:'Saldo líquido em '+y}}}}));
}
function lista(){
 const L=rows.filter(r=>r.tipo==tab&&mo(r)===mes&&(!fil||r.cat===fil)).sort((a,b)=>b.data.localeCompare(a.data));
 const car=tab=='car';
 return chips()+`
 <div class="card"><form onsubmit="add(event)">
 ${dtb('data','date',new Date().toISOString().slice(0,10),'qd(this)')}
 <select name="cat" aria-label="Tópico">${C[tab].map(c=>`<option>${esc(c)}</option>`).join('')}</select>
 <input class="w" name="desc" placeholder="Descrição" required>
 ${tab=='ent'?`<label class="w q">Quita o mês (a entrada paga as contas do mês anterior ao recebimento)${dtb('quita','month',pm(new Date().toISOString().slice(0,10)))}</label>`:''}
 <input name="valor" type="number" step="0.01" inputmode="decimal" placeholder="Valor (R$)" required>
 ${car?'<input name="parc" type="number" min="1" inputmode="numeric" placeholder="Parcelas (1)"><input name="parcAt" type="number" min="1" inputmode="numeric" placeholder="Parcela atual (1)">':''}
 <button class="a">Adicionar</button></form></div>
 ${car?`<div class="card"><div class="t3"><label class="a src">📷 Foto<input type="file" accept="image/*" onchange="ler(this)"></label><label class="a src">📄 PDF<input type="file" accept="application/pdf,.pdf" onchange="ler(this)"></label><button type="button" class="a src" onclick="bank()">🏦 Banco</button></div><input type="password" placeholder="Senha do PDF (se houver)" value="${esc(pw)}" oninput="pw=this.value" style="margin-top:8px;width:100%;height:46px;box-sizing:border-box;font-size:16px"><div>${note}</div>${preview()}</div>`:''}
 <div class="card">${L.map(r=>`<div class="i"><span>${esc(r.desc)}<small>${r.data.split('-').reverse().join('/')} · ${sel(r.cat,"setCat('"+r.id+"',this.value)")}${r.parc>1?` · ${r.parcAt}/${r.parc}`:''}${r.proj?' · previsto':''}${r.tipo=='ent'?' · quita '+mo(r).split('-').reverse().join('/'):''}</small></span><span>${brl(r.valor)} <button onclick="del('${r.id}')">✕</button></span></div>`).join('')||'<small>Nenhum lançamento neste mês.</small>'}</div>`;
}
function add(e){e.preventDefault();const f=new FormData(e.target);
 const R={tipo:tab,data:f.get('data'),desc:f.get('desc'),cat:f.get('cat'),valor:+f.get('valor'),parc:+f.get('parc')||1,parcAt:+f.get('parcAt')||1,fatura:mes,...(f.get('quita')?{quita:f.get('quita')}:{})};if(!R.desc||!isFinite(R.valor)||!R.data||R.parcAt>R.parc){toast('⚠ Confira data, descrição, valor e parcelas (atual ≤ total)',5000);return}(tab=='car'&&R.parc>1?(g=>Promise.all(g.ps).then(()=>toast('✓ Salvo · '+g.p+' parcela(s) prevista(s) nos meses seguintes'),fail))(lancarCar([R])):put(R).then(saved,fail));const m=mo(R);if(m!==mes){mes=m;fil='';toast('Lançado em '+m.split('-').reverse().join('/'))}e.target.reset();draw();}
function put(r){if(col)return col.add(r);r.id=Math.random()+'';rows.push(r);draw();return Promise.resolve()}
